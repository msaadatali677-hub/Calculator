<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculator </title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      padding: 20px;
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background: #111827;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid #263449;
    }

    .title {
      text-align: center;
      color: #00d9ff;
      margin-bottom: 15px;
      font-size: 22px;
    }

    /* Display */
    .display {
      width: 100%;
      height: 90px;
      background: #020617;
      border: none;
      outline: none;
      border-radius: 15px;
      margin-bottom: 18px;
      padding: 15px;
      color: white;
      text-align: right;
      font-size: 35px;
      overflow: hidden;
    }

    /* Buttons */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 15px;
      background: #1e293b;
      color: white;
      font-size: 21px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #334155;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #0369a1;
    }

    .operator:hover {
      background: #0284c7;
    }

    .clear {
      background: #dc2626;
    }

    .clear:hover {
      background: #ef4444;
    }

    .delete {
      background: #92400e;
    }

    .delete:hover {
      background: #b45309;
    }

    .equal {
      background: #0891b2;
      grid-column: span 2;
    }

    .equal:hover {
      background: #06b6d4;
    }

    .zero {
      grid-column: span 2;
    }

        /* Mobile */
    @media (max-width: 400px) {
      .calculator {
        padding: 15px;
      }

      button {
        height: 58px;
        font-size: 19px;
      }

      .display {
        height: 80px;
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="calculator">

    <h1 class="title">Calculator</h1>

    <!-- Display -->
    <input
      type="text"
      id="display"
      class="display"
      value="0"
      readonly
    >

    <!-- Buttons -->
    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">AC</button>

      <button class="delete" onclick="deleteLast()">DEL</button>

      <button class="operator" onclick="addOperator('%')">%</button>

      <button class="operator" onclick="addOperator('/')">÷</button>


      <button onclick="addNumber('7')">7</button>

      <button onclick="addNumber('8')">8</button>

      <button onclick="addNumber('9')">9</button>

      <button class="operator" onclick="addOperator('*')">×</button>


      <button onclick="addNumber('4')">4</button>

      <button onclick="addNumber('5')">5</button>

      <button onclick="addNumber('6')">6</button>

      <button class="operator" onclick="addOperator('-')">−</button>


      <button onclick="addNumber('1')">1</button>

      <button onclick="addNumber('2')">2</button>

      <button onclick="addNumber('3')">3</button>

      <button class="operator" onclick="addOperator('+')">+</button>


      <button class="zero" onclick="addNumber('0')">0</button>

      <button onclick="addNumber('.')">.</button>

      <button class="equal" onclick="calculate()">=</button>

    </div>

   

  </div>


  <script>

    const display = document.getElementById("display");

    let currentInput = "0";


    /* =========================
       UPDATE DISPLAY
    ========================== */

    function updateDisplay() {
      display.value = currentInput;
    }


    /* =========================
       ADD NUMBER
    ========================== */

    function addNumber(number) {

      if (currentInput === "0") {
        currentInput = number;
      } else {
        currentInput += number;
      }

      updateDisplay();
    }


    /* =========================
       ADD OPERATOR
    ========================== */

    function addOperator(operator) {

      const lastCharacter =
        currentInput.slice(-1);

      const operators = ["+", "-", "*", "/", "%"];

      if (operators.includes(lastCharacter)) {
        currentInput =
          currentInput.slice(0, -1) + operator;
      } else {
        currentInput += operator;
      }

      updateDisplay();
    }


    /* =========================
       CLEAR
    ========================== */

    function clearDisplay() {

      currentInput = "0";

      updateDisplay();
    }


    /* =========================
       DELETE LAST CHARACTER
    ========================== */

    function deleteLast() {

      if (currentInput.length > 1) {
        currentInput =
          currentInput.slice(0, -1);
      } else {
        currentInput = "0";
      }

      updateDisplay();
    }


    /* =========================
       CALCULATE RESULT
    ========================== */

    function calculate() {

      try {

        let expression = currentInput;

        /*
          Convert percentage into
          division by 100.
        */
        expression = expression.replace(
          /(\d+(\.\d+)?)%/g,
          "($1/100)"
        );

        /*
          Calculate expression.
          Only calculator-generated input
          is processed here.
        */
        const result = Function(
          '"use strict"; return (' +
          expression +
          ')'
        )();

        if (!Number.isFinite(result)) {
          currentInput = "Error";
        } else {
          currentInput =
            Number.isInteger(result)
              ? String(result)
              : String(
                  parseFloat(result.toFixed(10))
                );
        }

      } catch (error) {

        currentInput = "Error";

      }

      updateDisplay();
    }


    /* =========================
       KEYBOARD SUPPORT
    ========================== */

    document.addEventListener("keydown", function(event) {

      const key = event.key;

      /* Numbers */
      if (key >= "0" && key <= "9") {

        if (currentInput === "Error") {
          currentInput = "0";
        }

        addNumber(key);
      }


      /* Decimal */
      else if (key === ".") {
        addNumber(".");
      }


      /* Operators */
      else if (
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/" ||
        key === "%"
      ) {
        addOperator(key);
      }


      /* Enter / = */
      else if (key === "Enter" || key === "=") {

        calculate();

      }


      /* Backspace */
      else if (key === "Backspace") {

        deleteLast();

      }


      /* Escape */
      else if (key === "Escape") {

        clearDisplay();

      }

    });

  </script>

</body>
</html>
